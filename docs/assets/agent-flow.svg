<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">猫たちが進めるharness-agent-loopのスプリント契約フロー</title>
  <desc id="desc">魔法使い猫のPlannerが仕様を作り、剣士猫のGeneratorと重装備猫のEvaluatorが契約を合意した後、実装と評価を反復する流れ</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6fc"/><stop offset="1" stop-color="#eef9f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#234b5d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0 0v7l8-3.5z" fill="#337e83"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0 0v7l8-3.5z" fill="#159957"/></marker>
    <symbol id="wizard-cat" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#e9e2ff"/>
      <path d="M17 34l3-17 11 9 13-9 3 17" fill="#f3cda4" stroke="#714f86" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="32" cy="39" rx="18" ry="16" fill="#fff4df" stroke="#714f86" stroke-width="2"/>
      <path d="M17 23L36 2l12 23z" fill="#7451a6" stroke="#513675" stroke-width="2" stroke-linejoin="round"/><path d="M13 25c9-3 30-3 39 0" fill="none" stroke="#513675" stroke-width="5" stroke-linecap="round"/>
      <path d="M36 8l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="#ffd75e"/>
      <path d="M22 39q4-5 8 0M34 39q4-5 8 0" fill="none" stroke="#273f56" stroke-width="2.4" stroke-linecap="round"/><path d="M29 44l3 2 3-2" fill="none" stroke="#c46d78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 46l-8 1M19 50l-8 4M46 46l8 1M45 50l8 4" stroke="#714f86" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="51" cy="10" r="2" fill="#ffd75e"/><circle cx="55" cy="17" r="1.4" fill="#fff"/>
    </symbol>
    <symbol id="swordsman-cat" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#dcf3e7"/>
      <path d="M46 8l5 5-25 31-5-5z" fill="#d7e8ee" stroke="#375d6c" stroke-width="2"/><path d="M19 37l10 9M17 42l7 6" stroke="#d98b2b" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 31l4-15 11 9 13-9 4 15" fill="#cf7e4e" stroke="#754329" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="32" cy="39" rx="18" ry="16" fill="#f5b77f" stroke="#754329" stroke-width="2"/>
      <path d="M17 28c9-5 21-5 31 0" stroke="#c8444e" stroke-width="5"/><path d="M45 25l10-5-7 9" fill="#e8676f"/>
      <circle cx="25" cy="38" r="2.3" fill="#263f52"/><circle cx="39" cy="38" r="2.3" fill="#263f52"/><path d="M29 43l3 2 3-2M24 48q8 5 16 0" fill="none" stroke="#754329" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M17 44l-8 1M18 49l-8 4M47 44l8 1M46 49l8 4" stroke="#754329" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="guardian-cat" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#dceeff"/>
      <path d="M16 31l3-15 10 8 13-8 5 15" fill="#bccbd7" stroke="#375568" stroke-width="2" stroke-linejoin="round"/>
      <path d="M17 28c2-14 28-17 31 0l-5 4H21z" fill="#718b9d" stroke="#375568" stroke-width="2"/><path d="M32 12v17M25 16h14" stroke="#dce8ef" stroke-width="2"/>
      <ellipse cx="32" cy="39" rx="16" ry="14" fill="#fff0d2" stroke="#375568" stroke-width="2"/>
      <circle cx="26" cy="38" r="2.2" fill="#18354f"/><circle cx="38" cy="38" r="2.2" fill="#18354f"/><path d="M29 43l3 2 3-2" fill="none" stroke="#bd6872" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 45l-7 1M47 45l7 1" stroke="#375568" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M45 35l11 4v9c0 7-5 11-11 14-6-3-11-7-11-14v-9z" fill="#397ba5" stroke="#244f6c" stroke-width="2"/><path d="M45 40v16M39 47h12" stroke="#dceeff" stroke-width="2"/>
    </symbol>
  </defs>
  <rect width="1000" height="480" rx="24" fill="url(#canvas)"/>
  <path d="M30 72h940M30 312h940" stroke="#fff" stroke-width="1" opacity=".75"/>
  <g font-family="Open Sans,Arial,sans-serif">
    <text x="50" y="43" fill="#55727d" font-size="13" font-weight="700" letter-spacing="2">SPRINT CONTRACT LOOP</text>
    <g transform="translate(52 120)" filter="url(#shadow)">
      <rect width="220" height="170" rx="18" fill="#fff" stroke="#bdd7e7" stroke-width="2"/><use href="#wizard-cat" x="20" y="19" width="48" height="48"/>
      <text x="78" y="42" fill="#18354f" font-size="21" font-weight="700">Planner</text><text x="24" y="91" fill="#159957" font-size="13" font-weight="700">01 — PLAN</text><text x="24" y="119" fill="#405d68" font-size="16" font-weight="600">仕様とスプリント</text><text x="24" y="145" fill="#70838a" font-size="13">機能とゴールを定義</text>
    </g>
    <g transform="translate(320 65)">
      <rect width="628" height="226" rx="22" fill="#fff" fill-opacity=".72" stroke="#e0b66f" stroke-width="2" stroke-dasharray="7 6"/><rect x="204" y="-15" width="220" height="31" rx="15.5" fill="#d98b2b"/><text x="314" y="6" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" letter-spacing="1">実装前のスプリント契約</text>
      <g transform="translate(30 54)" filter="url(#shadow)"><rect width="250" height="132" rx="16" fill="#fff" stroke="#c8dfd1" stroke-width="2"/><use href="#swordsman-cat" x="16" y="15" width="48" height="48"/><text x="72" y="38" fill="#18354f" font-size="19" font-weight="700">Generator</text><text x="22" y="84" fill="#159957" font-size="13" font-weight="700">02 — PROPOSE</text><text x="22" y="110" fill="#526a73" font-size="15">完了条件を起票</text></g>
      <g transform="translate(348 54)" filter="url(#shadow)"><rect width="250" height="132" rx="16" fill="#fff" stroke="#bdd7e7" stroke-width="2"/><use href="#guardian-cat" x="16" y="15" width="48" height="48"/><text x="72" y="38" fill="#18354f" font-size="19" font-weight="700">Evaluator</text><text x="22" y="84" fill="#155799" font-size="13" font-weight="700">03 — REVIEW</text><text x="22" y="110" fill="#526a73" font-size="15">契約を承認・差し戻し</text></g>
      <path d="M286 104h51" stroke="#d98b2b" stroke-width="3" marker-end="url(#arrow)"/><path d="M337 137h-51" stroke="#d98b2b" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <path d="M278 205h32" stroke="#337e83" stroke-width="4" marker-end="url(#arrow)"/><text x="283" y="189" fill="#55727d" font-size="12">仕様確認</text>
    <g transform="translate(319 344)"><g filter="url(#shadow)"><rect width="266" height="94" rx="16" fill="#183f57"/></g><use href="#swordsman-cat" x="15" y="24" width="46" height="46"/><text x="75" y="40" fill="#9edcc0" font-size="12" font-weight="700">04 — BUILD</text><text x="75" y="66" fill="#fff" font-size="18" font-weight="700">Generator が実装</text></g>
    <g transform="translate(682 344)"><g filter="url(#shadow)"><rect width="266" height="94" rx="16" fill="#147a59"/></g><use href="#guardian-cat" x="15" y="24" width="46" height="46"/><text x="75" y="40" fill="#c9f2df" font-size="12" font-weight="700">05 — VERIFY</text><text x="75" y="66" fill="#fff" font-size="18" font-weight="700">Evaluator が評価</text></g>
    <path d="M592 391h78" stroke="#159957" stroke-width="4" marker-end="url(#arrow-green)"/><path d="M818 447c-42 37-350 37-393 0" fill="none" stroke="#159957" stroke-width="3" marker-end="url(#arrow-green)"/><text x="621" y="472" text-anchor="middle" fill="#337e83" font-size="13" font-weight="600">不合格なら修正して再評価</text>
    <path d="M793 251c0 66-341 47-341 82" fill="none" stroke="#d98b2b" stroke-width="3" marker-end="url(#arrow)"/><text x="624" y="319" text-anchor="middle" fill="#9b6728" font-size="12">契約承認 → 実装へ</text>
  </g>
</svg>
